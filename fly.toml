# Fly.io deployment.
#
# Chosen for two reasons that matter to this app specifically:
#   - Frankfurt region. A German ERP integration processes German merchants'
#     customer data; EU residency is effectively a customer requirement and is
#     what the protected-customer-data declaration has to state.
#   - Persistent volumes, so the SQLite database survives a redeploy. Losing
#     OrderSync would lose the double-booking guard, and a duplicate posting
#     cannot be withdrawn under GoBD.
#
# Adapt or replace this if Scopevisio has its own hosting — the point is that
# the app now has a working, reproducible deployment rather than none.

app = "scopevisio-shopify-connector"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # The volume mounted below. NOT a path inside the image.
  DATABASE_URL = "file:/data/prod.sqlite"

[[mounts]]
  source = "connector_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # SQLite on a single volume means exactly one writer. Do not scale this to
  # more than one machine without moving to Postgres first.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Shopify webhooks and the admin iframe both need the app to answer promptly.
[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"
